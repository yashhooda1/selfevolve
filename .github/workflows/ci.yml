name: tests

# Ordinary correctness across supported Pythons and platforms. The offline
# guarantee is proven separately in airgap.yml — this workflow answers "does it
# work", that one answers "does it stay local".
#
# No secrets, no services, no network calls in the tests themselves. A fork PR
# runs this green with nothing configured.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # SQLite, console/ANSI, and path behaviour differ enough across
          # platforms to be worth a run each. Windows gets 3.14 specifically —
          # that's what the author actually develops on, and a matrix that
          # doesn't cover the machine the code is written on is decoration.
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.14"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest tests -q

      - name: Smoke-test the CLI end to end
        shell: bash
        env:
          SELFEVOLVE_EMBED_BACKEND: hash
          SELFEVOLVE_LLM_BACKEND: fake
          SELFEVOLVE_DATA_DIR: ./.ci-store
        run: |
          set -e
          # Every path here is relative to the workspace. /tmp is a trap on a
          # Windows runner: `shell: bash` is Git Bash, so MSYS tools resolve
          # /tmp to the MSYS temp directory, while native python.exe reads the
          # same string as C:\tmp. A file written by one is invisible to the
          # other, which is exactly how this step failed -- the grep steps passed
          # (both MSYS) and only the python one blew up.
          printf 'a\n\nr\nlinter covers docstrings\n' \
            | selfevolve --backend fake review examples/sample_code/pipeline.py --project ci
          selfevolve insights | tee ci-rules.txt
          grep -qi "docstring" ci-rules.txt || { echo "no rule was learned"; exit 1; }

          # Different file, different names, same classes of issue: the rejected
          # comment must not come back. This is the property that makes it an
          # evolving agent rather than a stateless one.
          printf 's\n' \
            | selfevolve --backend fake review examples/sample_code/handlers.py --project ci \
            | tee ci-second.txt
          grep -qi "Retrieved 1 lesson" ci-second.txt || { echo "lesson was not retrieved"; exit 1; }
          grep -qi "docstring" ci-second.txt || { echo "retrieved rule not shown"; exit 1; }

          selfevolve metrics
          selfevolve export --out ci-lessons.json
          python -c "import json; d=json.load(open('ci-lessons.json', encoding='utf-8')); assert d['insights'], 'empty export'; print('export ok:', len(d['insights']), 'rules')"

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned floor: the rule set is fixed in pyproject, but pin the tool too so
      # a lint failure always means the code changed, never that ruff did.
      - run: pip install "ruff>=0.15,<0.17"
      - run: ruff check .

  modelfile:
    name: published Modelfile is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      # The Ollama model published from this repo embeds the reviewer's system
      # prompt. If someone tunes the prompt in the task and forgets to
      # regenerate, the published model silently stops matching the repo it
      # claims to come from.
      - run: python scripts/build_modelfile.py --check
